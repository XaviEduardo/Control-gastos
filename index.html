<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Control de Gastos</title>
<link rel="stylesheet" href="css/variables.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/layout.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/utilities.css">
<link rel="stylesheet" href="css/responsive.css">
</head>
<body>
  <button type="button" class="sidebar-toggle" id="sidebarToggle" aria-label="Abrir menú" aria-expanded="false" aria-controls="sidebar">
    <span></span><span></span><span></span>
  </button>
  <div class="sidebar-overlay" id="sidebarOverlay"></div>

  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar__brand">
        <svg class="icon" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M16 12h3"/><circle cx="16.3" cy="12" r="0.6" fill="currentColor" stroke="none"/></svg>
        <span class="sidebar__brand-name">Control de Gastos</span>
      </div>

      <!-- V2-8: el contenido se genera en js/app.js#buildSidebarNav() a partir de
           ROUTE_META + NAV_GROUPS — evita tener una segunda fuente de verdad hardcodeada
           aquí que pudiera desincronizarse de las rutas reales. -->
      <nav class="sidebar__nav" aria-label="Navegación principal"></nav>
    </aside>

    <div class="app-main">
      <header class="app-header">
        <h1 class="app-header__title" id="pageTitle">Dashboard</h1>
        <span class="app-header__saved" id="lastSavedLabel"></span>
      </header>
      <main class="app-content" id="appContent" tabindex="-1"></main>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/chart.js@4/dist/chart.umd.min.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
